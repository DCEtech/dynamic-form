<!-- Paso 5: Perfiles de Acceso -->
<div class="step-content">
    <div class="row mb-4">
        <div class="col-12">
            <div class="alert alert-info d-flex align-items-center">
                <i class="bi bi-shield-lock me-3 fs-4"></i>
                <div>
                    <strong>Configuración de Perfiles de Acceso</strong><br>
                    Defina los permisos de entrada. Cada perfil indica qué puertas se pueden abrir y en qué horario.
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <button type="button" class="btn btn-success" id="add-nivel">
                <i class="bi bi-plus-circle me-2"></i>Agregar Perfil de Acceso
            </button>
        </div>
    </div>

    <div id="niveles-container">
        <!-- Template de perfil -->
        <div class="nivel-item card mb-4 shadow-sm" style="display: none;" id="nivel-template">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <h6 class="mb-0 fw-bold text-primary">
                    <i class="bi bi-key me-2"></i>Perfil de Acceso
                </h6>
                <button type="button" class="btn btn-sm btn-outline-danger remove-nivel">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Nombre del Perfil *</label>
                        <input type="text" class="form-control nivel-nombre" placeholder="Ej: Personal de Limpieza"
                               required>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Descripción del perfil *</label>
                        <textarea class="form-control nivel-descripcion" rows="2"
                                  placeholder="Áreas a las que tiene permitido acceder..." required></textarea>
                    </div>
                </div>

                <div class="row">
                    <!-- Puertas -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Puertas Permitidas</label>
                        <div class="puertas-grid p-2 border rounded bg-light">
                            <div class="form-check"><input class="form-check-input" type="checkbox"
                                                           name="puerta_principal"><label class="form-check-label">P.
                                Principal</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox"
                                                           name="puerta_trasera"><label class="form-check-label">P.
                                Trasera</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox"
                                                           name="puerta_oficina"><label
                                    class="form-check-label">Oficina</label></div>
                        </div>
                        <div class="mt-2">
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" class="form-control puerta-personalizada-input"
                                       placeholder="Otra puerta...">
                                <button class="btn btn-outline-secondary add-puerta-btn" type="button">+</button>
                            </div>
                            <div class="puertas-personalizadas-list d-flex flex-wrap gap-1"></div>
                        </div>
                    </div>

                    <!-- Horarios -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Horario de Acceso</label>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input acceso-24h" type="checkbox" checked>
                            <label class="form-check-label">Acceso 24/7</label>
                        </div>
                        <div class="horarios-restringidos" style="display: none;">
                            <div class="row g-2">
                                <div class="col-6">
                                    <small class="d-block text-muted">Inicio:</small>
                                    <input type="time" class="form-control form-control-sm hora-inicio" value="08:00">
                                </div>
                                <div class="col-6">
                                    <small class="d-block text-muted">Fin:</small>
                                    <input type="time" class="form-control form-control-sm hora-fin" value="18:00">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('niveles-container');
        const template = document.getElementById('nivel-template');

        window.addNivel = function (data = null) {
            const el = template.cloneNode(true);
            el.id = "";
            el.style.display = 'block';

            // Eventos básicos
            el.querySelector('.remove-nivel').onclick = () => el.remove();

            const chk24h = el.querySelector('.acceso-24h');
            const hRestringidos = el.querySelector('.horarios-restringidos');
            chk24h.onchange = () => hRestringidos.style.display = chk24h.checked ? 'none' : 'block';

            // Lógica puertas personalizadas
            const pList = el.querySelector('.puertas-personalizadas-list');
            const pInput = el.querySelector('.puerta-personalizada-input');
            el.querySelector('.add-puerta-btn').onclick = () => {
                if (pInput.value.trim()) {
                    createDoorBadge(pList, pInput.value.trim());
                    pInput.value = "";
                }
            };

            function createDoorBadge(list, name) {
                const badge = document.createElement('span');
                badge.className = "badge bg-secondary d-flex align-items-center gap-1 p-2 custom-door-tag";
                badge.innerHTML = `${name} <i class="bi bi-x-circle cursor-pointer remove-tag"></i>`;
                badge.querySelector('.remove-tag').onclick = () => badge.remove();
                list.appendChild(badge);
            }

            // Cargar Datos si existen
            if (data) {
                el.querySelector('.nivel-nombre').value = data.nombre || '';
                el.querySelector('.nivel-descripcion').value = data.descripcion || '';
                chk24h.checked = data.acceso_24h !== false;
                chk24h.onchange();
                el.querySelector('.hora-inicio').value = data.hora_inicio || (chk24h.checked ? '' : '08:00');
                el.querySelector('.hora-fin').value = data.hora_fin || (chk24h.checked ? '' : '18:00');

                if (data.puertas) {
                    data.puertas.forEach(p => {
                        const chk = el.querySelector(`input[name="${p}"]`);
                        if (chk) chk.checked = true;
                        else createDoorBadge(pList, p); // Si no es estándar, es personalizada
                    });
                }
            }

            container.appendChild(el);
            return el;
        };

        document.getElementById('add-nivel').onclick = () => window.addNivel();

        // Carga inicial
        const existing = window.formularioData?.datosFormulario?.perfiles_acceso || [];
        if (existing.length > 0) existing.forEach(d => window.addNivel(d));
        else window.addNivel();
    });
</script>
